# Deploys the single-origin image (API + SPA) to Azure App Service (Web App for Containers).
# Needs repository secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC, no stored Azure passwords)
# and variables ACR_NAME, AZURE_WEBAPP_NAME.
name: Deploy to Azure
on:
  workflow_dispatch:
permissions: { contents: read, id-token: write }
concurrency: { group: azure-deploy, cancel-in-progress: false }
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image in Azure Container Registry
        run: az acr build --registry "${{ vars.ACR_NAME }}" --image "homeintel:${{ github.sha }}" --image homeintel:latest .
      - name: Deploy the image to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/homeintel:${{ github.sha }}
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health" && exit 0
            sleep 10
          done
          echo "Health check did not pass within 5 minutes" >&2; exit 1
